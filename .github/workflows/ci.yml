# Three jobs so a failure names itself. `typecheck` and `test` are hermetic; the
# unit suite runs with `TSA_DB_PATH=off` and a stubbed `fetch`. `e2e` spawns the
# built server and fetches a real page, so it can go red for a reason that is not
# in anyone's change — keeping it apart means that cannot hide a broken build.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # `engines.node`, and the version `better-sqlite3` prebuilds resolve
          # against. pnpm comes from `packageManager` in package.json.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # With coverage: the thresholds in `vitest.config.mts` catch a module
      # landing with no test, which is invisible to a green suite.
      - run: pnpm test:coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds first, and asserts against the artifact rather than the source.
      - run: pnpm test:e2e
